<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" id="themeColor" content="#15131f" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%23EC4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Crect x='14' y='20' width='36' height='26' rx='4' fill='none' stroke='%23fff' stroke-width='3.5'/%3E%3Cpath d='M15 24 32 37 49 24' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<title>MailProxy 邮箱</title>
<style>
/* ============================================================
   MailProxy · 「冰态果冻」主题
   与电脑版 DNS加速器 同一套视觉：弥散粉紫渐变、玻璃拟态卡片、
   紫→品红渐变主按钮、圆角 12px、Segoe UI。
   ============================================================ */
:root {
  --bg0: #FFF0F5; --bg1: #FFE4E1; --bg2: #E6E6FA;
  --surface: rgba(255,255,255,0.70);
  --surface-hi: rgba(255,255,255,0.90);
  --surface-lo: rgba(255,255,255,0.55);
  --sidebar: rgba(255,255,255,0.62);
  --border: #F3DCE9;
  --text: #1E1B4B;
  --text2: #6366F1;
  --text3: #A5A8D8;
  --accent: #EC4899;
  --accent-h: #F472B6;
  --accent-p: #DB2777;
  --grad: linear-gradient(90deg, #8B5CF6, #EC4899);
  --green: #34C759;
  --orange: #FF9500;
  --red: #EE5A6F;
  --purple: #8B5CF6;
  --radius: 12px;
  --card-bg: rgba(255,255,255,0.78);
  --input-bg: rgba(255,255,255,0.68);
  --btn-bg: rgba(255,255,255,0.62);
  --panel-bg: rgba(255,255,255,0.35);
  --subj: #4a4a6a;
}
/* ===== 深色模式 ===== */
[data-theme="dark"] {
  --bg0: #15131f; --bg1: #1d1830; --bg2: #241d3a;
  --surface: rgba(42,36,64,0.72);
  --surface-hi: rgba(54,46,82,0.92);
  --surface-lo: rgba(34,29,52,0.55);
  --sidebar: rgba(38,32,58,0.72);
  --border: #3a2f55;
  --text: #ECE9FB;
  --text2: #B8A6F0;
  --text3: #8A82B8;
  --accent: #F472B6;
  --accent-h: #F9A8D4;
  --accent-p: #DB2777;
  --grad: linear-gradient(90deg, #A78BFA, #F472B6);
  --card-bg: rgba(46,40,68,0.82);
  --input-bg: rgba(54,47,80,0.65);
  --btn-bg: rgba(58,50,86,0.72);
  --panel-bg: rgba(40,34,60,0.50);
  --subj: #a99fc7;
}
[data-theme="dark"] body {
  background:
    radial-gradient(1100px 700px at 8% -8%,   rgba(60,48,92,0.95), transparent 60%),
    radial-gradient(1000px 720px at 96% 4%,   rgba(46,38,72,0.90), transparent 62%),
    radial-gradient(900px 640px at 20% 108%,  rgba(72,46,84,0.75), transparent 60%),
    radial-gradient(880px 600px at 88% 100%,  rgba(40,34,62,0.78), transparent 62%),
    #15131f;
  background-attachment: fixed;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",sans-serif;
  font-size: 14px; color: var(--text);
  /* 弥散粉紫渐变：左上樱粉 → 右侧薰衣草 → 底部雾玫瑰（同 PC paintEvent） */
  background:
    radial-gradient(1100px 700px at 8% -8%,   rgba(255,228,225,0.95), transparent 60%),
    radial-gradient(1000px 720px at 96% 4%,   rgba(230,230,250,0.90), transparent 62%),
    radial-gradient(900px 640px at 20% 108%,  rgba(255,209,220,0.75), transparent 60%),
    radial-gradient(880px 600px at 88% 100%,  rgba(216,191,246,0.65), transparent 62%),
    var(--bg0);
  background-attachment: fixed;
  overflow: hidden;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.30); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: rgba(139,92,246,0.50); }
::-webkit-scrollbar-track { background: transparent; }

/* ===== 通用控件 ===== */
.btn {
  border: 1px solid var(--border); border-radius: 9px; cursor: pointer;
  background: var(--btn-bg); color: var(--text);
  padding: 7px 16px; font-size: 13px; font-weight: 500;
  font-family: inherit; transition: all .15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { background: var(--surface-hi); }
.btn:active { background: var(--surface-hi); }
.btn.primary {
  background: var(--grad); color: #fff; border: none; font-weight: 600;
  box-shadow: 0 4px 14px rgba(236,72,153,0.30);
}
.btn.primary:hover { filter: brightness(1.07); box-shadow: 0 6px 18px rgba(236,72,153,0.40); }
.btn.primary:disabled { background: #E8B7CF; box-shadow: none; cursor: default; }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: rgba(238,90,111,0.10); }
.btn:disabled { color: var(--text3); cursor: default; }
.btn svg { flex-shrink: 0; }

input[type="text"], input:not([type]), textarea, select {
  font-family: inherit; font-size: 13.5px; color: var(--text);
  background: var(--input-bg);
  border: 1px solid var(--border); border-radius: 9px;
  padding: 9px 12px; outline: none; transition: all .15s ease;
}
input:focus, textarea:focus, select:focus {
  border: 1.5px solid var(--accent); background: var(--surface-hi);
}
select { cursor: pointer; }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 10px 34px rgba(88,70,170,0.10);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.card-h {
  padding: 13px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px;
}
.card-h .tag { font-size: 12px; color: var(--text3); font-weight: 400; }
.card-h .sp { margin-left: auto; }

/* ===== 登录 ===== */
.login-mask {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
}
.login-card {
  width: 360px; padding: 38px 34px 30px; border-radius: 16px;
  background: var(--card-bg); border: 1px solid var(--border);
  box-shadow: 0 22px 60px rgba(88,70,170,0.28);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
}
.login-card .mark {
  width: 52px; height: 52px; border-radius: 16px; background: var(--grad);
  display: flex; align-items: center; justify-content: center; margin-bottom: 16px;
  box-shadow: 0 8px 20px rgba(236,72,153,0.35);
}
.login-card h1 { margin: 0; font-size: 21px; letter-spacing: .5px; }
.login-card .sub { color: var(--text3); font-size: 12px; margin: 5px 0 24px; }
.login-card input { width: 100%; }
.login-card .btn.primary { width: 100%; justify-content: center; margin-top: 16px; padding: 11px 0; font-size: 15px; }
.login-tip { margin-top: 14px; font-size: 12px; color: var(--text3); text-align: center; }
.theme-toggle {
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
  border: 1px solid var(--border); background: var(--btn-bg); color: var(--text);
  font-size: 16px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(88,70,170,0.16);
  transition: all .15s ease;
}
.login-mask .theme-toggle { position: fixed; top: 18px; right: 20px; z-index: 25; width: 40px; height: 40px; font-size: 18px; }
.theme-toggle:hover { background: var(--surface-hi); transform: scale(1.06); }
.theme-toggle:active { transform: scale(0.96); }

/* ===== 主框架 ===== */
#topbar {
  height: 54px; display: flex; align-items: center; gap: 14px; padding: 0 20px;
}
#topbar .logo { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
#topbar .logo .mark {
  width: 32px; height: 32px; border-radius: 10px; background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(236,72,153,0.32);
}
#topbar .domain {
  background: var(--btn-bg); border: 1px solid var(--border);
  color: var(--text2); border-radius: 14px; padding: 4px 14px; font-size: 12px;
}
#topbar .right { margin-left: auto; display: flex; gap: 8px; }
.linkbtn {
  border: none; background: transparent; cursor: pointer; font-family: inherit;
  font-size: 13px; color: var(--text2); padding: 7px 14px; border-radius: 8px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
}
.linkbtn:hover { background: rgba(139,92,246,0.10); }
.linkbtn.quit:hover { background: rgba(238,90,111,0.10); color: var(--red); }

#app { display: flex; height: calc(100vh - 54px); padding: 0 16px 16px; gap: 14px; }
#sidebar {
  width: 188px; flex-shrink: 0; border-radius: 14px; padding: 14px 10px;
  background: var(--sidebar); border: 1px solid var(--border);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 34px rgba(88,70,170,0.08);
  display: flex; flex-direction: column; gap: 6px;
}
.btn-compose {
  width: 100%; padding: 11px 0; border: none; border-radius: 10px; cursor: pointer;
  background: var(--grad); color: #fff; font-size: 15px; font-weight: 600;
  font-family: inherit; box-shadow: 0 6px 16px rgba(236,72,153,0.32);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all .15s ease;
}
.btn-compose:hover { filter: brightness(1.07); box-shadow: 0 8px 20px rgba(236,72,153,0.42); }
.folders { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.folder {
  display: flex; align-items: center; gap: 9px; padding: 10px 12px; border-radius: 9px;
  cursor: pointer; color: var(--text2); font-size: 13.5px; border: none; background: transparent;
  width: 100%; text-align: left; font-family: inherit; transition: all .15s ease;
}
.folder:hover { background: rgba(139,92,246,0.10); color: var(--text); }
.folder.active { background: rgba(236,72,153,0.12); color: var(--accent); font-weight: 600; }
.folder .cnt { margin-left: auto; font-size: 12px; color: var(--text3); }
.folder.active .cnt { color: var(--accent); }

/* 折叠分组：grid-rows 0fr→1fr 丝滑拉出 */
.nav-group { display: flex; flex-direction: column; }
.group-toggle .caret { margin-left: auto; font-size: 11px; color: var(--text3); transition: transform .25s ease; }
.group-toggle.open .caret { transform: rotate(90deg); }
.sub { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .28s cubic-bezier(.4,0,.2,1); }
.sub.open { grid-template-rows: 1fr; }
.sub-inner { overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
.subfolder { padding: 8px 12px 8px 20px; font-size: 13px; }

/* ===== 其他应用（侧栏最底部，点击向上丝滑拉出） ===== */
.otherapps-wrap { position: relative; margin-top: auto; padding-top: 8px; }
.otherapps-btn {
  width: 100%; display: flex; align-items: center; gap: 9px;
  padding: 8px 12px; border-radius: 9px; cursor: pointer;
  color: var(--text2); font-size: 12.5px; border: 1px dashed var(--border);
  background: transparent; text-align: left; font-family: inherit;
  transition: background .15s ease, color .15s ease;
}
.otherapps-btn:hover { background: rgba(139,92,246,0.10); color: var(--text); }
.otherapps-btn .caret { margin-left: auto; font-size: 10px; color: var(--text3); transition: transform .25s ease; }
.otherapps-btn.open .caret { transform: rotate(180deg); }
.otherapps-pop {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 8px);
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 14px 40px rgba(88,70,170,0.18);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  padding: 6px; display: flex; flex-direction: column; gap: 2px;
  opacity: 0; transform: translateY(12px) scale(.97); transform-origin: bottom center;
  pointer-events: none; visibility: hidden;
  transition: opacity .26s ease, transform .28s cubic-bezier(.4,0,.2,1), visibility .26s;
}
.otherapps-pop.open { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; visibility: visible; }
.otherapps-item {
  display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 8px;
  color: var(--text2); font-size: 13px; text-decoration: none; cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.otherapps-item:hover { background: rgba(139,92,246,0.10); color: var(--text); }

#view { flex: 1; overflow: auto; min-width: 0; }

/* ===== 邮件列表 ===== */
.mrow {
  display: flex; align-items: center; gap: 12px; padding: 13px 18px;
  border-bottom: 1px solid rgba(243,220,233,0.85); cursor: pointer; transition: background .12s;
}
.mrow:last-child { border-bottom: none; }
.mrow:hover { background: rgba(236,72,153,0.06); }
.mrow .avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: var(--grad); color: #fff; font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.mrow .from { width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.mrow .subj { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--subj); }
.mrow .time { color: var(--text3); font-size: 12px; flex-shrink: 0; }
.empty { padding: 48px; text-align: center; color: var(--text3); }

/* ===== 读信 ===== */
.read-h { padding: 16px 20px 14px; border-bottom: 1px solid var(--border); }
.read-h h2 { margin: 0 0 8px; font-size: 17px; }
.read-h .meta { color: var(--text3); font-size: 12px; line-height: 1.8; }
.read-h .meta b { color: var(--text2); font-weight: 500; }
.read-h .ops { margin-top: 12px; display: flex; gap: 8px; }
.read-body { padding: 18px 20px; white-space: pre-wrap; word-break: break-word; line-height: 1.75; min-height: 140px; }

/* ===== 写信 ===== */
.c-row { display: flex; align-items: flex-start; border-bottom: 1px solid rgba(243,220,233,0.85); }
.c-row label {
  width: 78px; text-align: right; padding: 13px 12px 0 0; color: var(--text2);
  font-size: 13px; flex-shrink: 0; font-weight: 500;
}
.c-row input, .c-row textarea, .c-row .selwrap {
  flex: 1; border: none; border-radius: 0; background: transparent; margin: 8px 14px 8px 0;
}
.c-row input { padding: 5px 0; }
.c-row textarea { min-height: 240px; resize: vertical; padding: 5px 0; line-height: 1.7; }
.selwrap { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
.selwrap select { flex: 1; max-width: 460px; }
.c-toolbar { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid rgba(243,220,233,0.85); }
.c-atts { padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-height: 20px; }
.att {
  display: flex; align-items: center; gap: 7px; padding: 6px 11px; font-size: 12px;
  background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.22);
  color: var(--text2); border-radius: 8px; max-width: 280px;
}
.att .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.att .sz { color: var(--text3); flex-shrink: 0; }
.att .x { cursor: pointer; color: var(--text3); font-weight: 700; flex-shrink: 0; border: none; background: none; font-size: 13px; padding: 0; }
.att .x:hover { color: var(--red); }
.c-foot {
  padding: 11px 16px; color: var(--text3); font-size: 12px; line-height: 1.7;
  border-top: 1px solid rgba(243,220,233,0.85); border-radius: 0 0 var(--radius) var(--radius);
  background: var(--panel-bg);
}
.new-addr-box {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  padding: 10px 14px 10px 88px; background: var(--panel-bg);
  border-bottom: 1px solid rgba(243,220,233,0.85);
}

/* ===== 账号池 ===== */
.arow { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid rgba(243,220,233,0.85); }
.arow:last-child { border-bottom: none; }
.arow .avatar {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; font-size: 14px;
  background: linear-gradient(135deg, #8B5CF6, #F472B6); color: #fff; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.arow .loc { font-weight: 600; min-width: 180px; }
.arow .note { color: var(--text3); font-size: 12px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.addr-form { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; background: var(--panel-bg); }

/* ===== Toast（纵向堆叠，不重叠） ===== */
#toast-box {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  z-index: 99; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
}
.toast {
  background: rgba(30,27,75,0.92); color: #fff; padding: 11px 22px;
  border-radius: 10px; font-size: 13px; max-width: 80vw; text-align: center;
  box-shadow: 0 10px 30px rgba(30,27,75,0.35);
  animation: rise .2s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.hidden { display: none !important; }

/* ===== 卡片弹窗（替代浏览器原生 confirm / alert） ===== */
.modal-mask {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(20,16,40,0.45);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  animation: fade .15s ease;
}
.modal-card {
  width: 348px; max-width: 90vw; padding: 22px 22px 18px; border-radius: 14px;
  background: var(--card-bg); border: 1px solid var(--border);
  box-shadow: 0 24px 60px rgba(20,16,40,0.38);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: var(--text);
}
.modal-card h3 { margin: 0 0 8px; font-size: 16px; }
.modal-card .m-body { color: var(--text2); font-size: 13.5px; line-height: 1.7; margin-bottom: 16px; word-break: break-word; }
.modal-card .m-body b { color: var(--text); }
.modal-card .m-ops { display: flex; gap: 8px; justify-content: flex-end; }
@keyframes fade { from { opacity: 0; } }

/* ===== 复选框 ===== */
.msel, .msel-all input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
.msel-all { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text3); cursor: pointer; margin-left: 10px; }
.bar-sel { font-size: 12px; color: var(--text3); margin-left: 10px; }

/* ===== 附件读取进度条 ===== */
.up-progress { display: flex; align-items: center; gap: 8px; margin: 6px 14px; }
.up-progress .track { flex: 1; height: 6px; background: var(--panel-bg); border-radius: 3px; overflow: hidden; }
.up-progress .bar { height: 100%; width: 0; background: var(--grad); border-radius: 3px; transition: width .15s ease; }
.up-progress span { font-size: 12px; color: var(--text3); flex-shrink: 0; }

/* ===== 账号头像 / 裁剪 ===== */
.avatar-btn { cursor: pointer; transition: transform .15s ease; }
.avatar-btn:hover { transform: scale(1.08); box-shadow: 0 0 0 2px var(--accent-h); }
.arow .avatar img, .mrow .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.crop-cv { display: block; margin: 10px auto 0; border-radius: 10px; cursor: move; touch-action: none; max-width: 88vw; border: 1px solid var(--border); }
.crop-tip { color: var(--text3); font-size: 12px; text-align: center; margin-top: 6px; }

/* ===== 云盘空间占用条 ===== */
.drv-track { height: 8px; background: var(--panel-bg); border-radius: 4px; overflow: hidden; }
.drv-bar { height: 100%; background: var(--grad); border-radius: 4px; transition: width .3s ease; }

/* ===== 手机端适配（≤720px） ===== */
@media (max-width: 720px) {
  #topbar { padding: 0 12px; gap: 8px; }
  #topbar .logo { font-size: 15px; }
  #topbar .domain { display: none; }
  #topbar .right { gap: 2px; }
  .linkbtn { padding: 7px 8px; font-size: 12.5px; }
  .theme-toggle { width: 32px; height: 32px; font-size: 15px; }
  .login-mask .theme-toggle { top: 12px; right: 12px; }

  /* 侧栏 → 顶部横向导航 */
  #app { flex-direction: column; padding: 0 10px 10px; gap: 10px; }
  #sidebar { width: 100%; flex-direction: row; align-items: center; padding: 8px 10px; gap: 8px; }
  .btn-compose { width: auto; padding: 8px 16px; font-size: 13.5px; }
  .folders { margin-top: 0; flex-direction: row; margin-left: auto; gap: 2px; }
  .folder { padding: 8px 10px; width: auto; }

    </div>
    <h1>MailProxy 邮箱</h1>

    <input id="ac" placeholder="请输入账号" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="btn primary" onclick="doLogin()">登 录</button>
    <div class="login-tip">仅限授权用户使用</div>
  </div>

<script>
const LS_TK = 'mp_tk';
const DOMAIN = 'your-domain.example.com'; // 仅用于界面展示；后端发信域名由 env.DOMAIN 决定
const MAX_SINGLE = 30 * 1048576;   // 邮件单附件上限 30MB（Resend 按 base64 后 40MB 计，30MB 为临界值）
const MAX_TOTAL  = 30 * 1048576;   // 邮件附件总量上限 30MB
const DRIVE_MAX  = 25 * 1048576;   // 云盘单文件上限 25MB（免费版 10ms CPU 实测：25MB 稳定通过，30MB 超 CPU）
let state = { tk: localStorage.getItem(LS_TK) };
let atts = [];        // 待发附件 [{ filename, type, size, content(b64) }]
let addrPool = [];    // 账号池缓存
let sending = false;  // 发送中标志（期间锁定附件增删）

function api(path, opts = {}) {
  return fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + state.tk, ...(opts.headers || {}) }
  }).then(r => r.json().catch(() => ({ ok: false })));
}
function toast(msg) {
  let box = document.getElementById('toast-box');
  if (!box) { box = document.createElement('div'); box.id = 'toast-box'; document.body.appendChild(box); }
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  box.appendChild(d); setTimeout(() => d.remove(), 2600);
}
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmtTime(ts) { const d = new Date(ts), n = new Date(); return d.toDateString() === n.toDateString() ? d.toTimeString().slice(0,5) : (d.getMonth()+1) + '-' + d.getDate(); }
function fmtSize(b) { return b > 1048576 ? (b/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b/1024)) + ' KB'; }
function initial(s) { const t = (s || '?').trim(); return t ? t[0].toUpperCase() : '?'; }

// 选择状态（收件箱 / 账号池 批量操作）
let selIds = new Set();      // 已勾选邮件 id
let selAddrs = new Set();    // 已勾选账号 local
let curInboxTo = '';         // 当前收件箱过滤（'' = 全部）
let inboxSelMode = false;    // 收件箱是否处于多选模式
let addrSelMode = false;     // 账号池是否处于多选模式

// ---------- 页面内卡片弹窗（替代浏览器原生 confirm / alert） ----------
function confirmModal({ title, body, okText = '确定', danger = false, onOk }) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `
    <div class="modal-card">
      <h3>${esc(title)}</h3>
      <div class="m-body">${body}</div>
      <div class="m-ops">
        <button class="btn" id="m-cancel">取消</button>
        <button class="btn ${danger ? 'danger' : 'primary'}" id="m-ok">${esc(okText)}</button>
      </div>
    </div>`;
  document.body.appendChild(mask);
  const close = () => mask.remove();
  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  mask.querySelector('#m-cancel').onclick = close;
  mask.querySelector('#m-ok').onclick = () => { close(); if (onOk) onOk(); };
}

// ---------- 主题（深色 / 浅色） ----------
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('mp_theme', t);
  document.querySelectorAll('.theme-toggle').forEach(b => b.textContent = (t === 'dark') ? '☀️' : '🌙');
  const tc = document.getElementById('themeColor');
  if (tc) tc.content = (t === 'dark') ? '#15131f' : '#FFF0F5';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('mp_theme') || 'dark');   // 默认深色，首次访问即深色

function setActive(id) {
  ['nav-inbox','nav-addr','nav-sent','nav-drafts','nav-star','nav-del','nav-junk','nav-contact','nav-drive','nav-contacts','nav-notes']
    .forEach(x => { const el = document.getElementById(x); if (el) el.classList.toggle('active', x === id); });
}
// 折叠分组展开/收起（记忆状态）
function toggleGroup(name) {
  const sub = document.getElementById('sub-' + name);
  const btn = sub.previousElementSibling;
  const open = !sub.classList.contains('open');
  sub.classList.toggle('open', open);
  btn.classList.toggle('open', open);
  localStorage.setItem('mp_grp_' + name, open ? '1' : '0');
}
function initGroups() {
  ['outbox', 'more', 'apps'].forEach(name => {
    if (localStorage.getItem('mp_grp_' + name) === '1') {
      document.getElementById('sub-' + name).classList.add('open');
      document.getElementById('sub-' + name).previousElementSibling.classList.add('open');
    }
  });
}
function toggleOtherApps() {
  const pop = document.getElementById('otherapps-pop');
  const btn = document.getElementById('otherapps-btn');
  const open = !pop.classList.contains('open');
  pop.classList.toggle('open', open);
  btn.classList.toggle('open', open);
}
document.addEventListener('click', e => {
  const wrap = document.querySelector('.otherapps-wrap');
  const pop = document.getElementById('otherapps-pop');
  if (pop && pop.classList.contains('open') && wrap && !wrap.contains(e.target)) {
    pop.classList.remove('open');
    document.getElementById('otherapps-btn').classList.remove('open');
  }
});

// ---------- 登录 ----------
async function doLogin() {
  const account = document.getElementById('ac').value.trim();
  if (!account) { toast('请输入账号'); return; }
  const r = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ account })
  }).then(r => r.json().catch(() => ({ ok: false })));
  if (r.ok && r.token) { localStorage.setItem(LS_TK, r.token); state.tk = r.token; enter(); }
  else if (r.error && /频繁/.test(r.error)) toast(r.error);
  else toast('账号或权限不对');
}
function logout() { localStorage.removeItem(LS_TK); location.reload(); }
function enter() {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('app').style.display = 'flex';
  showInbox();
}

// ---------- 账号池（地址别名） ----------
async function loadAddrPool() {
  const r = await api('/api/addresses');
  addrPool = Array.isArray(r) ? r : [];
  return addrPool;
}
// 把账号池渲染进发件人下拉；prefill 用于回复/编辑时预选
async function fillFromSelect(prefill) {
  const sel = document.getElementById('f_from');
  if (!sel) return;
  if (!addrPool.length) await loadAddrPool();
  sel.innerHTML = addrPool.map(a =>
    `<option value="${esc(a.local)}">${esc(a.local)}${a.note ? '（' + esc(a.note) + '）' : ''}</option>`
  ).join('') + `<option value="__new__">➕ 新建邮箱…</option>`;
  sel.onchange = () => { if (sel.value === '__new__') openNewAddr(); };
  if (prefill && addrPool.some(a => a.local === prefill)) sel.value = prefill;
}
function openNewAddr() {
  document.getElementById('new-addr-box').classList.remove('hidden');
  setTimeout(() => document.getElementById('n_local').focus(), 30);
}
function cancelNewAddr() {
  document.getElementById('new-addr-box').classList.add('hidden');
  const sel = document.getElementById('f_from');
  if (sel && addrPool.length) sel.selectedIndex = 0; else if (sel) sel.value = '__new__';
}
async function saveNewAddr() {
  let local = document.getElementById('n_local').value.trim();
  const note = document.getElementById('n_note').value.trim();
  if (!local) { toast('请输入邮箱名'); return; }
  if (!local.includes('@')) local = local + '@' + DOMAIN;
  if (!local.endsWith('@' + DOMAIN)) { toast('必须是 @' + DOMAIN + ' 域名'); return; }
  const r = await api('/api/addresses', { method: 'POST', body: JSON.stringify({ local, note }) });
  if (!r.ok) { toast(r.error || '新建失败'); return; }
  await loadAddrPool();
  document.getElementById('new-addr-box').classList.add('hidden');
  document.getElementById('n_local').value = '';
  document.getElementById('n_note').value = '';
  await fillFromSelect(local);
  toast('✅ 已新建 ' + local);
}

// ---------- 收件箱（支持按收件账号过滤 + 多选模式批量删除） ----------
async function showInbox(to) {
  if (to === undefined) to = curInboxTo; else curInboxTo = to;
  setActive('nav-inbox');
  const r = await api('/api/messages' + (to ? '?to=' + encodeURIComponent(to) : ''));
  const list = r || [];
  document.getElementById('inbox-cnt').textContent = list.length || '';

  const selBar = inboxSelMode
    ? `<label class="msel-all"><input type="checkbox" onclick="toggleSelAll(this, [${ids.join(',')}])"> 全选</label>

    : `<button class="btn" onclick="toggleSelMode()">多选</button>`;
  document.getElementById('view').innerHTML = `

      </div>
      ${list.length ? list.map(m => `
        <div class="mrow" onclick="readMsg(${m.id})">
          ${inboxSelMode ? `<input type="checkbox" class="msel" ${selIds.has(m.id) ? 'checked' : ''} onclick="event.stopPropagation();toggleSel(${m.id},this)" />` : ''}
          <div class="avatar">${esc(initial(m.from_addr))}</div>

    </div>`;
}

function toggleSel(id, cb) { if (cb.checked) selIds.add(id); else selIds.delete(id); }
function toggleSelAll(cb, ids) {

function showCompose(prefill = {}) {
  setActive('');
  atts = [];
  window.currentDraftId = prefill.draftId || null;
  document.getElementById('view').innerHTML = `
    <div class="card">

        <button class="btn" id="attbtn" onclick="document.getElementById('file-in').click()">📎 添加附件</button>
        <button class="btn" onclick="saveDraft()">存草稿</button>
        <button class="btn" onclick="showInbox()">取消</button>
        <input type="file" id="file-in" multiple style="display:none" onchange="addFiles(this.files)" />
      </div>
      <div class="c-row">
        <label>发件人</label>
        <div class="selwrap"><select id="f_from"></select>
        <button class="btn" onclick="openNewAddr()">+ 新建邮箱</button></div>
      </div>
      <div class="new-addr-box hidden" id="new-addr-box">
        <input id="n_local" placeholder="名字（如 taobao）或 完整地址" style="width:300px" />
        <input id="n_note" placeholder="备注（如 淘宝注册）" style="width:200px" />
        <button class="btn primary" onclick="saveNewAddr()">保存</button>
        <button class="btn" onclick="cancelNewAddr()">取消</button>
      </div>
      <div class="c-row"><label>收件人</label><input id="f_to" placeholder="收件人邮箱，多个用逗号隔开" value="${esc(prefill.to || '')}" /></div>
      <div class="c-row"><label>主　题</label><input id="f_subject" placeholder="主题" value="${esc(prefill.subject || '')}" /></div>
      <div class="c-row"><label></label><textarea id="f_text" placeholder="正文…"></textarea></div>
      <div class="c-atts" id="att-list"></div>
      <div class="up-progress hidden" id="up-progress"><div class="track"><div class="bar" id="up-bar"></div></div><span id="up-pct">0%</span></div>
      <div class="c-foot">发件人来自「账号池」，可在此一键新建；邮件以 @${DOMAIN} 身份经安全通道发出，对方看不到真实邮箱。附件单文件 ≤ 30MB、总量 ≤ 30MB（Resend 按编码后 40MB 计费上限，恰好 30MB 属临界值，建议 ≤ 28MB）。</div>
    </div>`;
  renderAtts();
  fillFromSelect(prefill.from);
}
function renderAtts() {
  const box = document.getElementById('att-list');
  if (!box) return;
  box.innerHTML = atts.map((a, i) => `
    <div class="att" ${a.loading ? 'style="opacity:.6"' : ''}><span class="nm">${esc(a.filename)}</span><span class="sz">${a.loading ? '读取中…' : (a.failed ? '读取失败' : fmtSize(a.size))}</span><button class="x" onclick="rmAtt(${i})">✕</button></div>
  `).join('') + (atts.length ? `<span style="color:var(--text3);font-size:12px">共 ${fmtSize(atts.reduce((s,a)=>s+a.size,0))}</span>` : '');
}
function addFiles(files) {
  if (sending) { toast('发送中，暂不能修改附件'); return; }
  let pendingTotal = atts.reduce((s, a) => s + a.size, 0);   // 同步累计，防止多选时异步读取导致总量校验失效
  for (const f of files) {
    if (f.size > MAX_SINGLE) { toast(f.name + ' 超过 ' + fmtSize(MAX_SINGLE) + '，已跳过'); continue; }
    if (pendingTotal + f.size > MAX_TOTAL) { toast('附件总量将超过 ' + fmtSize(MAX_TOTAL) + '，' + f.name + ' 已跳过'); continue; }
    pendingTotal += f.size;
    const att = { filename: f.name, type: f.type || 'application/octet-stream', size: f.size, content: '', loading: true, loaded: 0 };
    atts.push(att);
    const rd = new FileReader();
    rd.onload = () => { att.content = rd.result.split(',')[1]; att.loading = false; att.loaded = att.size; updateProgress(); renderAtts(); };
    rd.onprogress = (e) => { if (e.lengthComputable) { att.loaded = e.loaded; updateProgress(); } };
    rd.onerror = () => { att.loading = false; att.failed = true; updateProgress(); renderAtts(); toast(f.name + ' 读取失败，请移除后重试'); };
    rd.readAsDataURL(f);
  }
  document.getElementById('file-in').value = '';
  updateProgress();
  renderAtts();
}
function updateProgress() {
  const box = document.getElementById('up-progress');
  if (!box) return;
  const total = atts.reduce((s, a) => s + a.size, 0);
  const loaded = atts.reduce((s, a) => s + Math.min(a.loaded || 0, a.size), 0);
  const reading = atts.some(a => a.loading);
  if (!total || (!reading && atts.every(a => a.content || a.failed))) {
    if (!reading) { box.classList.add('hidden'); box.dataset.done = '1'; }
    return;
  }
  box.classList.remove('hidden');
  const pct = total ? Math.min(100, Math.floor(loaded / total * 100)) : 0;
  document.getElementById('up-bar').style.width = pct + '%';
  document.getElementById('up-pct').textContent = '读取附件 ' + pct + '%';
}
function rmAtt(i) { if (sending) { toast('发送中，暂不能修改附件'); return; } atts.splice(i, 1); updateProgress(); renderAtts(); }

async function sendMail() {
  if (sending) return;
  const btn = document.getElementById('sendbtn');
  const attBtn = document.getElementById('attbtn');
  const from = document.getElementById('f_from').value;
  if (!from || from === '__new__') { toast('请选择或新建发件人'); return; }
  // 发送前二次校验附件大小（单文件 ≤40MB、总量 ≤40MB）
  const overs = atts.filter(a => a.size > MAX_SINGLE);
  if (overs.length) { toast(overs.map(a => a.filename).join('、') + ' 超过 ' + fmtSize(MAX_SINGLE) + '，请先移除'); return; }
  if (atts.reduce((s, a) => s + a.size, 0) > MAX_TOTAL) { toast('附件总量超过 ' + fmtSize(MAX_TOTAL) + '，请移除部分附件'); return; }
  if (atts.some(a => a.loading || (!a.content && !a.failed))) { toast('附件还在读取中，请稍候'); return; }
  if (atts.some(a => a.failed)) { toast('有附件读取失败，请先移除'); return; }
  sending = true;
  btn.disabled = true; btn.textContent = '发送中…';
  if (attBtn) { attBtn.disabled = true; attBtn.style.opacity = '.5'; attBtn.style.cursor = 'default'; }
  const r = await api('/api/send', { method: 'POST', body: JSON.stringify({
    from,
    to: document.getElementById('f_to').value.trim(),
    subject: document.getElementById('f_subject').value.trim(),
    text: document.getElementById('f_text').value,
    attachments: atts.map(a => ({ filename: a.filename, type: a.type, content: a.content })),
  })});
  sending = false;
  btn.disabled = false; btn.textContent = '发送';
  if (attBtn) { attBtn.disabled = false; attBtn.style.opacity = ''; attBtn.style.cursor = ''; }
  if (r.ok) { toast('✅ 发送成功'); showInbox(); }
  else {
    let msg = r.error || '';
    try { const d = JSON.parse(r.detail || ''); msg = d.message || msg; } catch (e) {}
    toast('发送失败：' + (msg || (r.detail || '').slice(0, 80) || '未知'));
  }
}

function fileIcon(type) {
  const t = (type || '');
  if (t.startsWith('image/')) return '🖼️';
  if (t.startsWith('video/')) return '🎬';
  if (t.startsWith('audio/')) return '🎵';
  if (t.includes('pdf')) return '📕';
  if (t.includes('zip') || t.includes('rar') || t.includes('7z')) return '🗜️';
  if (t.startsWith('text/')) return '📄';
  return '📦';
}

function driveUploadOne(file, onProgress) {
  // 二进制直传：请求体就是文件字节，XHR 才能拿到真实上传进度
  return new Promise((res, rej) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/drive?name=' + encodeURIComponent(file.name) + '&type=' + encodeURIComponent(file.type || 'application/octet-stream'));
    xhr.setRequestHeader('Authorization', 'Bearer ' + state.tk);
    xhr.responseType = 'json';
    xhr.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    xhr.onload = () => res(xhr.response || { ok: false, error: 'HTTP ' + xhr.status });
    xhr.onerror = () => rej(new Error('network'));
    xhr.send(file);
  });
}
async function driveUpload(fileList) {
  if (driveUploading) return;
  const files = [...fileList];
  document.getElementById('drv-file').value = '';
  if (!files.length) return;
  driveUploading = true;
  const prog = document.getElementById('drv-progress');
  prog.classList.remove('hidden');
  const bar = document.getElementById('drv-bar'), pct = document.getElementById('drv-pct');
  for (const f of files) {
    if (f.size > DRIVE_MAX) { toast(f.name + ' 超过 25MB，已跳过'); continue; }
    try {
      const r = await driveUploadOne(f, p => {
        const w = Math.floor(p * 100);
        bar.style.width = w + '%'; pct.textContent = '上传 ' + f.name + ' ' + w + '%';
      });
      if (!r.ok) toast(r.error || (f.name + ' 上传失败'));
    } catch (e) { toast(f.name + ' 上传失败（网络错误）'); }
  }
  driveUploading = false;
  toast('✅ 上传完成'); showDrive();
}

  document.body.appendChild(mask);
  const close = () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); mask.remove(); };
  const cv = mask.querySelector('#crop-cv'), ctx = cv.getContext('2d');
  const slider = mask.querySelector('#crop-zoom');
  const img = new Image();
  let scale = 1, base = 1, ox = 0, oy = 0, dragging = false, lx = 0, ly = 0;
  function draw() {
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg2') || '#241d3a';
    ctx.fillRect(0, 0, 280, 280);
    ctx.drawImage(img, ox, oy, img.width * scale, img.height * scale);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 1.5;
    ctx.strokeRect(20, 20, 240, 240);
  }
  function clampPos() {
    const w = img.width * scale, h = img.height * scale;
    ox = w >= 280 ? Math.min(0, Math.max(ox, 280 - w)) : (280 - w) / 2;
    oy = h >= 280 ? Math.min(0, Math.max(oy, 280 - h)) : (280 - h) / 2;
  }
  function setScale(s) { scale = Math.min(base * 4, Math.max(base, s)); clampPos(); draw(); slider.value = (scale / base).toFixed(2); }
  img.onload = () => { base = Math.max(280 / img.width, 280 / img.height); scale = base; ox = (280 - img.width * scale) / 2; oy = (280 - img.height * scale) / 2; draw(); };
  img.src = dataUrl;
  cv.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
  function onMove(e) { if (!dragging) return; ox += e.clientX - lx; oy += e.clientY - ly; lx = e.clientX; ly = e.clientY; clampPos(); draw(); }
  function onUp() { dragging = false; }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  cv.addEventListener('wheel', e => { e.preventDefault(); setScale(scale * (e.deltaY < 0 ? 1.1 : 0.9)); }, { passive: false });
  slider.addEventListener('input', () => setScale(base * parseFloat(slider.value)));
  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  mask.querySelector('#crop-cancel').onclick = close;
  mask.querySelector('#crop-ok').onclick = () => {
    const out = document.createElement('canvas');
    out.width = out.height = 128;
    out.getContext('2d').drawImage(cv, 20, 20, 240, 240, 0, 0, 128, 128);
    const avatar = out.toDataURL('image/jpeg', 0.85);
    saveAvatar(local, avatar, close);
  };
}
async function saveAvatar(local, avatar, close) {
  const a = addrPool.find(x => x.local === local);
  const r = await api('/api/addresses', { method: 'POST', body: JSON.stringify({ local, note: (a && a.note) || '', avatar }) });
  if (!r.ok) { toast(r.error || '头像保存失败'); return; }
  await loadAddrPool();
  close();
  showAddr();
  toast('✅ 头像已更新');
}
function toggleSelAddr(local, cb) { if (cb.checked) selAddrs.add(local); else selAddrs.delete(local); }
function toggleSelAddrAll(cb, locals) {
  if (cb.checked) locals.forEach(l => selAddrs.add(l)); else selAddrs.clear();
  document.querySelectorAll('#view .msel').forEach(x => x.checked = cb.checked);
}
async function bulkDelAddrs() {
  const locals = [...selAddrs];
  if (!locals.length) { toast('请先勾选要删除的账号'); return; }
  confirmModal({
    title: '批量删除账号',
    body: `确定要删除选中的 <b>${locals.length}</b> 个邮箱身份吗？<br>已用它们发出的邮件不受影响，但之后无法再以这些身份发信。`,
    okText: '删除', danger: true,
    onOk: async () => {
      for (const l of locals) await api('/api/addresses/' + encodeURIComponent(l), { method: 'DELETE' });
      selAddrs.clear(); addrSelMode = false;
      await loadAddrPool(); showAddr(); toast('✅ 已删除 ' + locals.length + ' 个账号');
    }
  });
}
async function addAddr() {
  let local = document.getElementById('a_local').value.trim();
  const note = document.getElementById('a_note').value.trim();
  if (!local) { toast('请输入邮箱名'); return; }
  if (!local.includes('@')) local = local + '@' + DOMAIN;
  if (!local.endsWith('@' + DOMAIN)) { toast('必须是 @' + DOMAIN); return; }
  const r = await api('/api/addresses', { method: 'POST', body: JSON.stringify({ local, note }) });
  if (r.ok) { await loadAddrPool(); showAddr(); } else toast(r.error || '添加失败');
}
async function delAddr(encoded) {
  const local = decodeURIComponent(encoded);
  confirmModal({
    title: '删除账号',
    body: `确定删除邮箱身份 <b>${esc(local)}</b> 吗？<br>已用该身份发出的邮件不受影响，但之后无法再以它发信。`,
    okText: '删除', danger: true,
    onOk: async () => {
      await api('/api/addresses/' + encoded, { method: 'DELETE' });
      selAddrs.delete(local);
      await loadAddrPool(); showAddr(); toast('✅ 已删除 ' + local);
    }
  });
}

// 回复预填（发件人默认选账号池第一个）
function replyTo(addr, subject) {
  const first = addrPool.length ? addrPool[0].local : '';
  showCompose({ from: first, to: addr, subject: '回复：' + (subject || '') });
}

// 已有 token 直接进
initGroups();
if (state.tk) enter();
</script>
